---
# ============================================================================
# PHASE 6a — RHOAI DATA CONNECTIONS
# ============================================================================
# ONTAP S3 (default): read-only connection to the shared models bucket, so
# KServe InferenceServices and workbenches can load model weights. The key is
# read-only (GetObject, ListBucket, GetBucketLocation on models-prod only).
#
# MinIO (legacy, off by default): see 60a_minio_connection.yml. That path
# copies the shared MinIO admin keys into the partner namespace, so it is
# disabled unless enable_minio_connection is set to true.
#
# Per-tenant writable ONTAP buckets are NOT created here yet (stage two).
# ============================================================================

- name: "[ontap] Require read-only S3 key inputs"
  assert:
    that:
      - ontap_s3_ro_access_key | length == 20
      - ontap_s3_ro_secret_key | length == 40
    fail_msg: >
      ontap_s3_ro_access_key (20 chars) and ontap_s3_ro_secret_key (40 chars)
      must be supplied from an AAP credential or survey secret.
  when: enable_ontap_connection | bool
  no_log: true

- name: "[ontap] Create the ONTAP S3 read-only Data Connection secret"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: ontap-models-prod
        namespace: "{{ partner_namespace }}"
        labels:
          opendatahub.io/dashboard: "true"
          opendatahub.io/managed: "true"
        annotations:
          opendatahub.io/connection-type: s3
          openshift.io/display-name: "ONTAP S3 models (read-only)"
          serving.kserve.io/s3-endpoint: "{{ ontap_s3_ip }}"
          serving.kserve.io/s3-usehttps: "0"
      type: Opaque
      stringData:
        AWS_ACCESS_KEY_ID: "{{ ontap_s3_ro_access_key }}"
        AWS_SECRET_ACCESS_KEY: "{{ ontap_s3_ro_secret_key }}"
        AWS_S3_ENDPOINT: "http://{{ ontap_s3_ip }}"
        AWS_S3_BUCKET: "{{ ontap_s3_bucket }}"
        AWS_DEFAULT_REGION: us-east-1
  when: enable_ontap_connection | bool
  no_log: true

- name: "[minio] Legacy MinIO data connection"
  include_tasks: 60a_minio_connection.yml
  when: enable_minio_connection | bool
